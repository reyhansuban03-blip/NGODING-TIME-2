<!DOCTYPE html> 
<html> 
<head> 
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"> 
<title>Datalist Test</title> 
</head> 
<body> 
<form action="#" method="get"> 
   <p><label>Drinks: <input list="soda"></label></p> 
   <datalist id="soda"> 
     <option>Coke</option> 
     <option>Pepsi</option> 
     <option>Mr. Pibb</option> 
     <option>Mt. Dew</option> 
     <option>7-Up</option> 
   </datalist> 
</form> 
</body> 
</html>
