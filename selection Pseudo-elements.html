<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>::selection Pseudo-elements</title>
    <style type="text/css">
        #select1::selection{background-color: blue;}
        #select1::-moz-selection{background-color: aqua;}
        #select2::selection{color: gold;}
        #select2::-moz-selection{color: green;}
    </style>
</head>
<body>
    <p>Select <span id="select1">this text</span>. Now select <span id="select2">this text</span>.</p>
</body>
</html>
